name: ws-app CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ws-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint-test-build-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_ORIGIN: http://127.0.0.1:3000
      WS_API_BASE_URL: http://127.0.0.1:3012
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start isolated PostgreSQL with ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          auth_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$auth_secret"
          export POSTGRES_PASSWORD="$db_password"
          docker run --detach --rm --name ws-ci-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD \
            --env POSTGRES_DB=wheatandstone postgres:16 >/dev/null
          ready=0
          for attempt in {1..60}; do
            if docker exec ws-ci-postgres pg_isready -U postgres -d wheatandstone >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          {
            printf 'DATABASE_URL=postgresql://postgres:%s@127.0.0.1:5432/wheatandstone?schema=public\n' "$db_password"
            printf 'NEXTAUTH_SECRET=%s\n' "$auth_secret"
          } >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security posture gate
        id: security
        continue-on-error: true
        run: pnpm run security:check

      - name: Production dependency audit
        id: audit
        continue-on-error: true
        run: pnpm audit --prod

      - name: Migration gate
        id: migrations
        continue-on-error: true
        run: pnpm run ci:migrations

      - name: Lint gate
        id: lint
        continue-on-error: true
        run: pnpm run lint

      - name: Test gate
        id: test
        continue-on-error: true
        run: pnpm run test

      - name: Build gate
        id: build
        continue-on-error: true
        run: pnpm run build

      - name: Gate summary
        if: always()
        env:
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          MIGRATIONS_OUTCOME: ${{ steps.migrations.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          failures=0

          result_label() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              cancelled) echo "CANCELLED" ;;
              skipped) echo "SKIPPED" ;;
              "") echo "NOT_RUN" ;;
              *) echo "$1" ;;
            esac
          }

          gate_line() {
            gate="$1"
            outcome="$2"
            label="$(result_label "$outcome")"
            if [[ "$label" != "PASS" ]]; then
              failures=1
            fi
            echo "| ${gate} | ${label} |"
          }

          {
            echo "## ws-app CI Gate Summary"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            gate_line "security-posture" "$SECURITY_OUTCOME"
            gate_line "production-audit" "$AUDIT_OUTCOME"
            gate_line "migrations" "$MIGRATIONS_OUTCOME"
            gate_line "lint" "$LINT_OUTCOME"
            gate_line "test" "$TEST_OUTCOME"
            gate_line "build" "$BUILD_OUTCOME"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failures" -ne 0 ]]; then
            echo "::error::One or more ws-app CI gates failed."
            exit 1
          fi

      - name: Stop isolated PostgreSQL
        if: always()
        run: docker rm -f ws-ci-postgres >/dev/null 2>&1 || true
